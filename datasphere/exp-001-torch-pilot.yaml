name: exp-001-torch-pilot
desc: Train reference PyTorch VP for 100 steps and evaluate all DNS fields

cmd: >
  python3 -m diploma_pinn.cli train --config /job/configs/datasphere/exp001_torch_pilot.yaml

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/diploma_pinn/
      - configs/
      - data/processed/

outputs:
  - outputs/

cloud-instance-types:
  - g1.1

working-storage:
  type: SSD
  size: 100Gb

graceful-shutdown:
  signal: SIGTERM
  timeout: 30s
