name: exp-003-mode-observability
desc: Evaluate VP and VV residual sensitivity to prescribed temperature modes
cmd: python3 -m diploma_pinn.cli observability --config /job/configs/experiments/exp003/mode_observability.yaml
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths: [src/diploma_pinn/, configs/, data/processed/]
outputs: [outputs/]
cloud-instance-types: [c1.4]
working-storage: {type: SSD, size: 20Gb}
graceful-shutdown: {signal: SIGTERM, timeout: 30s}
